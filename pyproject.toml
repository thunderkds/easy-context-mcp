[project]
name = "easy-context-mcp"
version = "0.1.0"
description = "Local semantic context MCP server (stdio + streamable HTTP)"
requires-python = ">=3.10"
dependencies = ["mcp>=1.29,<2"]

[project.scripts]
easy-context-mcp = "easy_context_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "anyio>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/easy_context_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
