[project]
name = "easy-context-mcp"
version = "0.1.0"
description = "Local semantic context MCP server (stdio + streamable HTTP)"
requires-python = ">=3.10"
dependencies = [
    "fastembed>=0.9,<0.10",
    "mcp>=1.29,<2",
    "numpy>=1.26",
    "pathspec>=0.12",
    "tree-sitter>=0.25.2,<0.26",  # 0.26.0 segfaults walking large trees (HUN-16)
    "tree-sitter-java>=0.23,<0.24",
    "tree-sitter-javascript>=0.23,<0.26",
    "tree-sitter-kotlin>=1.1,<2",
    "tree-sitter-python>=0.23,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
]

[project.scripts]
easy-context-mcp = "easy_context_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "anyio>=4", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/easy_context_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: uses the real FastEmbed model (skips if the model cache is absent)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
